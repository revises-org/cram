[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
authors = ["Huy Nguyen Nhu"]
license = "Apache-2.0"
repository = "https://github.com/revises-org/cram"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
futures-util = "0.3"
gcp_auth = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
